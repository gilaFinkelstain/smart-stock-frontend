server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback — serve index.html for all non-file, non-/api routes
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API calls to the Flask backend, stripping the /api prefix.
    # The backend container always listens on port 5000 internally (set by FLASK_PORT).
    # The host mapping is controlled by BACKEND_HOST_PORT in docker-compose / .env.
    location /api/ {
        proxy_pass http://host.docker.internal:5000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
